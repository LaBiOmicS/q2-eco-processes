name: eco-processes
short_description: "QIIME 2 plugin for quantifying microbial ecological assembly processes (selection, dispersal, drift)."
description: |
  q2-eco-processes is an official QIIME 2 plugin designed for quantifying the relative influence 
  of 5 fundamental ecological assembly processes (Homogeneous Selection, Variable Selection, 
  Dispersal Limitation, Homogenizing Dispersal, and Undominated Drift) using phylogenetic null models 
  (Stegen et al. 2013).
framework_version: "2026.1"
version: "0.1.0"
source_url: "https://github.com/LaBiOmics/q2-eco-processes"
py_packages:
  - q2_eco_processes
plugin_type: "method_and_visualizer"
authors:
  - "LaBiOmics / UMC"
license: "BSD-3-Clause"
citations:
  - "Stegen JC et al. (2013) Quantifying community assembly processes and identifying features that impose them. The ISME Journal 7(11):2069-2079."
